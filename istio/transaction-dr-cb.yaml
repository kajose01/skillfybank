apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: transaction
spec:
  host: transaction
  trafficPolicy:
    connectionPool:
      tcp: {maxConnections: 1}
      http: {http1MaxPendingRequests: 1, maxRequestsPerConnection: 1}
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
