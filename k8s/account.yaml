apiVersion: v1
kind: PersistentVolume
metadata:
  name: account-pv
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/account-pv
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - {key: kubernetes.io/hostname, operator: In, values: [k3d-skillfy-agent-0]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  replicas: 1
  selector:
    matchLabels: {app: account}
  template:
    metadata:
      labels: {app: account}
    spec:
      initContainers:
      - name: fix-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod 777 /data"]
        volumeMounts: [{name: data, mountPath: /data}]
      containers:
      - name: account
        image: kaj1/skillfy-account:1.1
        ports: [{containerPort: 3000}]
        envFrom:
        - configMapRef: {name: bank-config}
        env:
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: db-credentials, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-credentials, key: DB_PASSWORD}}
        readinessProbe:
          httpGet: {path: /health, port: 3000}
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: account-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  type: NodePort
  selector: {app: account}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30080}]
