apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 2
  selector:
    matchLabels: {app: notification}
  template:
    metadata:
      labels: {app: notification}
    spec:
      nodeSelector:
        workload: notification
      tolerations:
      - {key: dedicated, operator: Equal, value: notification, effect: NoSchedule}
      containers:
      - name: notification
        image: kaj1/skillfy-notification:1.1
        ports: [{containerPort: 5000}]
        envFrom:
        - configMapRef: {name: bank-config}
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  type: LoadBalancer
  selector: {app: notification}
  ports: [{port: 5000, targetPort: 5000}]
