apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction
spec:
  replicas: 1
  selector:
    matchLabels: {app: transaction}
  template:
    metadata:
      labels: {app: transaction}
    spec:
      containers:
      - name: transaction
        image: kaj1/skillfy-transaction:1.1
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:
          httpGet: {path: /actuator/health, port: 8080}
          initialDelaySeconds: 40
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health, port: 8080}
          initialDelaySeconds: 90
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: transaction
spec:
  type: ClusterIP
  selector: {app: transaction}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: transaction}
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 50}
